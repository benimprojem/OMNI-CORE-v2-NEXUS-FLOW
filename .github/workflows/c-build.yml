name: C Compiler Build

on:
  push:
    branches:
      - main
      - refactor/c-core-roadmap
  pull_request:

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure C build
        run: cmake -S omnicore-sdk -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build C compiler
        run: cmake --build build --config Release --parallel

      - name: Run C tests
        run: ctest --test-dir build -C Release --output-on-failure

  sanitize:
    name: ASan/UBSan (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure sanitized C build
        run: cmake -S omnicore-sdk -B build-sanitized -DCMAKE_BUILD_TYPE=Debug -DOCC_ENABLE_SANITIZERS=ON

      - name: Build sanitized C compiler
        run: cmake --build build-sanitized --config Debug --parallel

      - name: Run tests with ASan/UBSan
        run: ctest --test-dir build-sanitized -C Debug --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

  valgrind:
    name: Valgrind (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      - name: Configure Valgrind build
        run: >
          cmake -S omnicore-sdk -B build-valgrind
          -DCMAKE_BUILD_TYPE=Debug
          -DMEMORYCHECK_COMMAND=/usr/bin/valgrind
          "-DMEMORYCHECK_COMMAND_OPTIONS=--leak-check=full --show-leak-kinds=all --errors-for-leak-kinds=all --track-origins=yes --error-exitcode=99"

      - name: Build C compiler
        run: cmake --build build-valgrind --config Debug --parallel

      - name: Run CTest under Valgrind
        run: ctest --test-dir build-valgrind -T memcheck --output-on-failure
